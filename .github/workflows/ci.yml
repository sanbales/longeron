name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    # lint + type-check + tests with coverage, in the locked default env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.67.0
          cache: true

      - run: pixi run lint
      - run: pixi run typecheck
      - run: pixi run coverage
      - run: pixi run test-vendor

  test-matrix:
    # the full test suite on every supported Python, from the same lockfile,
    # plus a Windows leg (newest Python only) for cross-platform coverage
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        environment: [py310, py311, py312, py313]
        include:
          - { os: windows-latest, environment: py313 }
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.67.0
          cache: true
          environments: ${{ matrix.environment }}

      - run: pixi run -e ${{ matrix.environment }} test

  grammar-regen:
    # the committed parsers must match the grammars (antlr + JDK come from
    # the lockfile; invoked directly to bypass the task's input/output cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.67.0
          cache: true

      - run: pixi run python scripts/generate_parsers.py

      - run: git diff --exit-code -- src/longeron/_gen
