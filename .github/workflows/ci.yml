name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache sysml2 model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sysml2
          key: sysml2-models-${{ matrix.python-version }}-${{ hashFiles('src/sysml2/_stdlib/**/*.sysml', 'src/sysml2/_gen/sysml/SysMLParser.py') }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests examples scripts

      - name: Type-check (mypy)
        run: mypy

      - name: Test (pytest + coverage)
        run: pytest -q --cov=sysml2 --cov-report=term-missing:skip-covered

  grammar-regen:
    # verify the committed parsers match the grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Regenerate parsers
        run: python scripts/generate_parsers.py

      - name: Diff against committed parsers
        run: git diff --exit-code -- src/sysml2/_gen
