name: release

# Publishes to PyPI via Trusted Publishing (OIDC) -- no tokens anywhere.
# The PyPI project 'longeron' is configured with a (pending) publisher for
# this repo + this workflow filename + the 'pypi' environment.
#
#   release = git tag vX.Y.Z && git push longeron vX.Y.Z

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: build + verify dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: tag matches package version
        run: |
          v="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - name: smoke test the wheel (fresh venv, no repo access)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          cd /tmp && /tmp/smoke/bin/python - <<'EOF'
          import sysml2
          from sysml2.validation import validate

          model = sysml2.loads(
              "package P { part def V { attribute m : Real = 1.0; }"
              " part def W { attribute bad : Reall; } }")
          diagnostics = validate(model)  # stdlib must resolve from the wheel
          assert len(diagnostics) == 1 and "Reall" in diagnostics[0].message
          assert sysml2.Interpreter(model).instantiate("P::V").slots["m"] == 1.0
          print("wheel smoke OK")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
