# Run: pre-commit install   (then hooks run on every commit)
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
        exclude: ^src/sysml2/_gen/
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        files: ^src/sysml2/.*\.py$
