[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysml2"
version = "0.2.0"
description = "Alias for 'longeron' (whose import name is `sysml2`): define, execute, and replay SysML v2 models in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "sanbales" }]
keywords = ["sysml", "sysml2", "kerml", "mbse", "systems-engineering"]
dependencies = ["longeron"]

[project.urls]
Homepage = "https://github.com/sanbales/longeron"

# metadata-only distribution: the actual `sysml2` module ships in longeron
[tool.setuptools]
packages = []
