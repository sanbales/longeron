[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longeron"
version = "0.4.0"
description = "Define, execute, and replay SysML v2 models in Python: ANTLR-based parser, validator, interpreter, and diagram renderers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "sanbales" }]
keywords = ["sysml", "sysml2", "kerml", "mbse", "systems-engineering", "modeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["antlr4-python3-runtime==4.13.2"]

[project.urls]
Homepage = "https://github.com/sanbales/longeron"
Repository = "https://github.com/sanbales/longeron"

[project.optional-dependencies]
dev = [
    "pytest>=8", "pytest-cov>=5", "mypy>=1.11", "ruff>=0.6",
    "pyecore>=0.15",
    "nbformat>=5", "nbclient>=0.10", "ipykernel>=6",  # notebooks
    "pytest-asyncio>=0.23",  # vendored ipyelk tests
    "anywidget>=0.9",  # replay widget + analysis viz widgets
    "matplotlib>=3.8",  # analysis viz figures (mirrors [viz])
    "openmdao>=3.30", "ortools>=9.8", "z3-solver>=4.12",  # analysis extras
    # (mirrors [mdao]/[trades]/[smt] so notebook 07 executes in CI)
    "rdflib>=7.0",  # mirrors [rdf] so notebook 08 executes in CI
    "fastapi>=0.110", "uvicorn>=0.29",  # mirrors [server] (API server tests)
    "httpx>=0.27",  # mirrors [client] (API client tests)
    # cadquery ([cad]) stays OUT of dev: the OCC kernel is ~1 GB and the
    # notebook's cadquery cell degrades to a printed note without it
]
docs = [
    # the documentation site (docs/): sphinx-build -W -b html docs build/docs
    # (executing the tutorial notebooks additionally needs the dev extras
    # plus node on PATH -- the pixi `docs` environment provides everything)
    "sphinx>=8",
    "myst-nb>=1.2",
    "furo>=2024.8",
    "sphinx-autodoc-typehints>=2",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
]
ecore = ["pyecore>=0.15"]
client = ["httpx>=0.27"]  # longeron.client: Systems Modeling API client
server = ["fastapi>=0.110", "uvicorn>=0.29", "pyecore>=0.15"]  # longeron serve
rdf = ["rdflib>=7.0"]  # longeron.rdf; longeron.rag deliberately needs NO extra
replay = ["anywidget>=0.9"]
mdao = ["openmdao>=3.30"]
trades = ["ortools>=9.8"]
smt = ["z3-solver>=4.12"]
viz = ["matplotlib>=3.8", "anywidget>=0.9"]
cad = ["cadquery>=2.5"]

[project.scripts]
longeron = "longeron.cli:main"
sysml2 = "longeron.cli:main"  # pre-0.3.0 command name, kept as an alias

[tool.setuptools.packages.find]
where = ["src"]  # picks up both longeron and the sysml2 compat shim

[tool.setuptools.package-data]
longeron = [
    "_gen/**/*.interp", "_gen/**/*.tokens", "_spec/*.ecore",
    "_spec/README.md",
    "_stdlib/prebuilt.json",  # stdlib-aware validation out of the box
    "_stdlib/**/*.sysml", "_stdlib/*.sysml",  # sources: the prebuilt is
    # fingerprinted against them and rebuilt from them when stale
    "_stdlib/README.md",
    "_js/elk.bundled.js",     # headless SVG/PNG layout (node still required)
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-include = ["*.ipynb"]  # lint + format notebook code cells too
extend-exclude = ["src/longeron/_gen"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade (modern typing & syntax)
    "B",   # bugbear
    "C4",  # comprehensions
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"src/longeron/__init__.py" = ["F403"]  # re-export of the model namespace
"src/sysml2/__init__.py" = ["F403"]  # compat shim re-exports longeron's surface

[tool.mypy]
python_version = "3.12"
files = ["src/longeron", "src/sysml2"]
exclude = ["src/longeron/_gen"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = "longeron._gen.*"
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
# the sysml2 compat shim aliases longeron dynamically (star re-export,
# module __getattr__, meta-path finder) -- not worth typing strictly
module = "sysml2"
ignore_errors = true

[[tool.mypy.overrides]]
module = "antlr4.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyecore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# lazy imports behind the [client]/[server] extras
module = ["fastapi.*", "starlette.*", "uvicorn.*", "httpx.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# vendored, pydantic-v1 models confuse mypy's constructor signatures
module = "ipyelk.*"
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cairosvg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openmdao.*", "ortools.*", "z3.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# lazy import behind the [rdf] extra
module = "rdflib.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# lazy imports behind the [viz]/[cad] extras
module = ["matplotlib.*", "cadquery.*", "ipywidgets.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# numpy stubs (via openmdao) use `type` statements needing py>=3.12,
# but we typecheck at python_version 3.10
module = "numpy.*"
follow_imports = "skip"
ignore_errors = true

[tool.coverage.run]
source = ["longeron"]
omit = ["*/_gen/*"]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# pixi (optional, hybrid): `pixi run check` etc. -- the venv/pip + Makefile
# workflow keeps working unchanged. Dependency truth stays in [project];
# pixi installs this package editable with its extras and only adds the
# conda-forge *toolchain*: a pinned Python and the ANTLR tool (which brings
# its own JDK, replacing manual Java setup for parser regeneration).
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.dependencies]
git = "*"  # deterministic git for the server/store + hook tests, all platforms
python = ">=3.10,<3.14"
antlr = "==4.13.2"  # must match the antlr4-python3-runtime pin in [project]
nodejs = ">=20"     # elkjs layout for headless diagram rendering
cairosvg = ">=2.7"  # SVG -> PNG (bundles the native cairo library)
jupyterlab = ">=4.1"

[tool.pixi.pypi-dependencies]
longeron = { path = ".", editable = true, extras = ["dev", "ecore"] }
ipyelk = { path = "vendor/ipyelk", editable = true }  # vendored, with local TLC

[tool.pixi.feature.docs.pypi-dependencies]
# mirrors [project.optional-dependencies].docs (the docs env also gets the
# default feature: dev extras, editable ipyelk, node -- notebook execution)
sphinx = ">=8"
myst-nb = ">=1.2"
furo = ">=2024.8"
sphinx-autodoc-typehints = ">=2"
sphinx-copybutton = ">=0.5"
sphinx-design = ">=0.6"

[tool.pixi.feature.docs.tasks]
# executes the tutorial notebooks; warnings are errors
docs = "sphinx-build -W -b html docs build/docs"
docs-serve = { cmd = "python -m http.server 8000 --directory build/docs", depends-on = ["docs"] }

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.environments]
# per-Python test environments; `pixi run -e py310 test` etc.
py310 = ["py310"]
py311 = ["py311"]
py312 = ["py312"]
py313 = ["py313"]
# docs = default toolchain (node, dev extras for notebook execution) + sphinx
docs = ["docs"]

[tool.pixi.tasks]
test = "pytest -q"
test-vendor = "pytest -c pyproject.toml -q vendor/ipyelk/tests"
lint = "ruff format --check src tests examples scripts notebooks docs && ruff check src tests examples scripts notebooks docs"
format = "ruff format src tests examples scripts notebooks docs && ruff check --fix src tests examples scripts notebooks docs"
typecheck = "mypy"
coverage = "pytest -q --cov=longeron --cov-report=term-missing:skip-covered"
demo = "python examples/demo.py"
stdlib = "python scripts/vendor_stdlib.py --prebuilt-only"
notebooks = "python scripts/run_notebooks.py"
hooks = "git config core.hooksPath scripts/git-hooks"
# serve from the repo root so both notebooks/ (longeron tutorials) and
# vendor/ipyelk/examples/ (ipyelk demos, incl. 07_Simulation) are browsable;
# PYTHONHASHSEED pins kernel hashing so interactive runs are deterministic
lab = { cmd = "jupyter lab notebooks/", env = { PYTHONHASHSEED = "0" } }
check = { depends-on = ["lint", "typecheck", "test", "test-vendor"] }

[tool.pixi.tasks.parsers]
cmd = "python scripts/generate_parsers.py"
inputs = ["grammars/*.g4", "scripts/generate_parsers.py"]
outputs = ["src/longeron/_gen/sysml/SysMLParser.py", "src/longeron/_gen/kerml/KerMLParser.py"]
