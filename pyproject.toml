[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysml2"
version = "0.2.0"
description = "Define, export, and execute SysML v2 models in Python, powered by ANTLR grammars for SysML v2 and KerML"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sysml2-experiments" }]
dependencies = ["antlr4-python3-runtime==4.13.2"]

[project.optional-dependencies]
dev = [
    "pytest>=8", "pytest-cov>=5", "mypy>=1.11", "ruff>=0.6",
    "pyecore>=0.15",
    "nbformat>=5", "nbclient>=0.10", "ipykernel>=6",  # notebooks
]
ecore = ["pyecore>=0.15"]

[project.scripts]
sysml2 = "sysml2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sysml2 = ["_gen/**/*.interp", "_gen/**/*.tokens", "_spec/*.ecore", "_spec/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["src/sysml2/_gen"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade (modern typing & syntax)
    "B",   # bugbear
    "C4",  # comprehensions
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"src/sysml2/__init__.py" = ["F403"]  # re-export of the model namespace

[tool.mypy]
python_version = "3.10"
files = ["src/sysml2"]
exclude = ["src/sysml2/_gen"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = "sysml2._gen.*"
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = "antlr4.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyecore.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["sysml2"]
omit = ["*/_gen/*"]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# pixi (optional, hybrid): `pixi run check` etc. -- the venv/pip + Makefile
# workflow keeps working unchanged. Dependency truth stays in [project];
# pixi installs this package editable with its extras and only adds the
# conda-forge *toolchain*: a pinned Python and the ANTLR tool (which brings
# its own JDK, replacing manual Java setup for parser regeneration).
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.14"
antlr = "==4.13.2"  # must match the antlr4-python3-runtime pin in [project]

[tool.pixi.pypi-dependencies]
sysml2 = { path = ".", editable = true, extras = ["dev", "ecore"] }

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.environments]
# per-Python test environments; `pixi run -e py310 test` etc.
py310 = ["py310"]
py311 = ["py311"]
py312 = ["py312"]
py313 = ["py313"]

[tool.pixi.tasks]
test = "pytest -q"
lint = "ruff check src tests examples scripts"
format = "ruff check --fix src tests examples scripts"
typecheck = "mypy"
coverage = "pytest -q --cov=sysml2 --cov-report=term-missing:skip-covered"
demo = "python examples/demo.py"
stdlib = "python scripts/vendor_stdlib.py --prebuilt-only"
notebooks = "python scripts/run_notebooks.py"
check = { depends-on = ["lint", "typecheck", "test"] }

[tool.pixi.tasks.parsers]
cmd = "python scripts/generate_parsers.py"
inputs = ["grammars/*.g4", "scripts/generate_parsers.py"]
outputs = ["src/sysml2/_gen/sysml/SysMLParser.py", "src/sysml2/_gen/kerml/KerMLParser.py"]
