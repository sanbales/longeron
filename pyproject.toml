[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysml2"
version = "0.2.0"
description = "Define, export, and execute SysML v2 models in Python, powered by ANTLR grammars for SysML v2 and KerML"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sysml2-experiments" }]
dependencies = ["antlr4-python3-runtime==4.13.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.11", "ruff>=0.6", "pyecore>=0.15"]
ecore = ["pyecore>=0.15"]

[project.scripts]
sysml2 = "sysml2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sysml2 = ["_gen/**/*.interp", "_gen/**/*.tokens", "_spec/*.ecore", "_spec/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["src/sysml2/_gen"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade (modern typing & syntax)
    "B",   # bugbear
    "C4",  # comprehensions
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"src/sysml2/__init__.py" = ["F403"]  # re-export of the model namespace

[tool.mypy]
python_version = "3.10"
files = ["src/sysml2"]
exclude = ["src/sysml2/_gen"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = "sysml2._gen.*"
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = "antlr4.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyecore.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["sysml2"]
omit = ["*/_gen/*"]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
