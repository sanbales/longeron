[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysml2"
version = "0.1.0"
description = "Define, export, and execute SysML v2 models in Python, powered by ANTLR grammars for SysML v2 and KerML"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sysml2-experiments" }]
dependencies = ["antlr4-python3-runtime==4.13.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sysml2 = "sysml2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sysml2 = ["_gen/**/*.interp", "_gen/**/*.tokens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
