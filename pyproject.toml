[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longeron"
version = "0.11.0"
description = "Define, execute, and replay SysML v2 models in Python: ANTLR-based parser, validator, interpreter, and diagram renderers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "sanbales" }]
keywords = ["sysml", "kerml", "mbse", "systems-engineering", "modeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["antlr4-python3-runtime==4.13.2"]

[project.urls]
Homepage = "https://github.com/sanbales/longeron"
Repository = "https://github.com/sanbales/longeron"

[project.optional-dependencies]
dev = [
    "pytest>=8", "pytest-cov>=5", "mypy>=1.11", "ruff>=0.6",
    "pyecore>=0.15",
    "nbformat>=5", "nbclient>=0.10", "ipykernel>=6",  # notebooks
    "pytest-asyncio>=0.23",  # vendored ipyelk tests
    "anywidget>=0.9",  # replay widget + analysis viz widgets
    "ipylab>=1",  # mirrors [explorer] (the lab docked layout)
    "matplotlib>=3.8",  # analysis viz figures (mirrors [viz])
    "openmdao>=3.30", "ortools>=9.8", "z3-solver>=4.12",  # analysis extras
    "hypothesis>=6.100",  # mirrors [verify] so tutorial 6's violation hunt executes
    # (mirrors [mdao]/[trades]/[smt] so tutorials 4 and 6 execute in CI)
    "rdflib>=7.0",  # mirrors [rdf] so tutorial 8 executes in CI
    "fastapi>=0.110", "uvicorn>=0.29",  # mirrors [server] (API server tests)
    "httpx>=0.27",  # mirrors [client] (API client tests)
    # maintainer ruling 2026-08-27: dev mirrors EVERY extra, cad included --
    # the OCC kernel is heavy (~1 GB installed) but the exact-boolean
    # occlusion engine and the cadquery notebook cells should run in dev
    # cadquery mirrors [cad] via PIXI (conda-forge) rather than this pypi
    # extra: cadquery-ocp ships no cp313 wheels on PyPI yet, conda-forge does
    "pint>=0.24",  # mirrors [units] (the conversion facade)
    "setuptools>=68",  # tests import setup.py (labextension data_files map)
]
docs = [
    # the documentation site (docs/): sphinx-build -W -b html docs build/docs
    # (executing the tutorial notebooks additionally needs the dev extras
    # plus node on PATH -- the pixi `docs` environment provides everything)
    "sphinx>=8",
    "myst-nb>=1.2",
    "furo>=2024.8",
    "sphinx-autodoc-typehints>=2",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
]
ecore = ["pyecore>=0.15"]
client = ["httpx>=0.27"]  # longeron.client: Systems Modeling API client
server = ["fastapi>=0.110", "uvicorn>=0.29", "pyecore>=0.15"]  # longeron serve
rdf = ["rdflib>=7.0"]  # longeron.rdf; longeron.rag deliberately needs NO extra
replay = ["anywidget>=0.9"]
explorer = ["ipylab>=1"]  # longeron.explorer: the 'lab' docked layout
mdao = ["openmdao>=3.30"]
trades = ["ortools>=9.8"]
smt = ["z3-solver>=4.12"]
verify = [
    # longeron.analysis.verify: Hypothesis-driven hunting/shrinking plus the
    # smt extra's Z3 for covering-array constraints, absence proofs, and the
    # domain ladder's assumption-derived bounds -- one extra lights the whole
    # surface (a hypothesis-only install still works for the sampling tiers)
    "hypothesis>=6.100",
    "longeron[smt]",
]
viz = ["matplotlib>=3.8", "anywidget>=0.9"]
cad = ["cadquery>=2.5"]
# composite extras: the analysis stack, the interactive UI stack, and the
# kitchen sink ([cad] is deliberately excluded from [all] -- the ~1 GB OCC
# kernel stays an explicit opt-in)
analysis = ["longeron[mdao,trades,smt,viz]"]
ui = ["longeron[explorer,replay,viz]"]
all = ["longeron[analysis,ui,verify,rdf,client,server,ecore]"]
units = [
    # longeron.units boundary tier: conversion, display, exchange (the
    # dimensional lint in longeron.validation needs NO extra -- it runs
    # on the in-house derived unit table, stdlib only)
    "pint>=0.24",
    "pint-pandas>=0.7",  # with_units(): unit-aware DataFrame columns
]
browser-test = [
    # the browser-truth test tier (tests/browser/): drives real JupyterLab
    # in headless Chromium; kept OUT of dev so default envs never grow a
    # browser (mirrored by the pixi `browser` feature below)
    "playwright>=1.55",
    "pytest-rerunfailures>=14",
    "pytest-timeout>=2.3",
]

[project.scripts]
longeron = "longeron.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
longeron = [
    "_gen/**/*.interp", "_gen/**/*.tokens", "_spec/*.ecore",
    "_spec/README.md",
    "_stdlib/prebuilt.json",  # stdlib-aware validation out of the box
    "_stdlib/**/*.sysml", "_stdlib/*.sysml",  # sources: the prebuilt is
    # fingerprinted against them and rebuilt from them when stale
    "_stdlib/README.md",
    "_js/elk.bundled.js",     # headless SVG/PNG layout (node still required)
    "_js/voronoi_treemap.bundled.js",  # scoreboard voronoi (vendored, BSD/ISC)
    "_js/voronoi_treemap.VENDOR.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: browser-truth tests (JupyterLab + Playwright); deselected by default, run with `pixi run test-browser`",
]
# the browser tier needs a booted JupyterLab and a Chromium binary: plain
# `pytest -q` deselects it; `pixi run test-browser` opts back in with `-m browser`
addopts = "-m 'not browser'"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-include = ["*.ipynb"]  # lint + format notebook code cells too
extend-exclude = ["src/longeron/_gen"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade (modern typing & syntax)
    "B",   # bugbear
    "C4",  # comprehensions
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"src/longeron/__init__.py" = ["F403"]  # re-export of the model namespace

[tool.mypy]
python_version = "3.12"
files = ["src/longeron"]
exclude = ["src/longeron/_gen"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = "longeron._gen.*"
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = "antlr4.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyecore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# lazy imports behind the [client]/[server] extras
module = ["fastapi.*", "starlette.*", "uvicorn.*", "httpx.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# vendored, pydantic-v1 models confuse mypy's constructor signatures
module = "ipyelk.*"
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cairosvg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# lazy imports behind the [units] extra
module = ["pint.*", "pint_pandas.*", "pandas.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["openmdao.*", "ortools.*", "z3.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# lazy import behind the [verify] extra
module = "hypothesis.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# lazy import behind the [explorer] extra
module = "ipylab.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# lazy import behind the [rdf] extra
module = "rdflib.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# lazy imports behind the [viz]/[cad] extras
module = ["matplotlib.*", "cadquery.*", "ipywidgets.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# numpy stubs (via openmdao) use `type` statements needing py>=3.12,
# but we typecheck at python_version 3.10
module = "numpy.*"
follow_imports = "skip"
ignore_errors = true

[tool.coverage.run]
source = ["longeron"]
omit = ["*/_gen/*"]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# pixi (optional, hybrid): `pixi run check` etc. -- the venv/pip + Makefile
# workflow keeps working unchanged. Dependency truth stays in [project];
# pixi installs this package editable with its extras and only adds the
# conda-forge *toolchain*: a pinned Python and the ANTLR tool (which brings
# its own JDK, replacing manual Java setup for parser regeneration).
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.dependencies]
git = "*"  # deterministic git for the server/store + hook tests, all platforms
python = ">=3.10,<3.14"
antlr = "==4.13.2"  # must match the antlr4-python3-runtime pin in [project]
nodejs = ">=20"     # elkjs layout for headless diagram rendering
cairosvg = ">=2.7"  # SVG -> PNG (bundles the native cairo library)
jupyterlab = ">=4.1"

cadquery = ">=2.5"  # [cad] mirror: OCC kernel from conda-forge (no cp313 pypi wheels)
[tool.pixi.pypi-dependencies]
longeron = { path = ".", editable = true, extras = ["dev", "ecore"] }
ipyelk = { path = "vendor/ipyelk", editable = true }  # vendored, with local TLC

[tool.pixi.feature.docs.pypi-dependencies]
# mirrors [project.optional-dependencies].docs (the docs env also gets the
# default feature: dev extras, editable ipyelk, node -- notebook execution)
sphinx = ">=8"
myst-nb = ">=1.2"
furo = ">=2024.8"
sphinx-autodoc-typehints = ">=2"
sphinx-copybutton = ">=0.5"
sphinx-design = ">=0.6"

[tool.pixi.feature.docs.tasks]
# executes the tutorial notebooks; warnings are errors
docs = "sphinx-build -W -b html docs build/docs"
docs-serve = { cmd = "python -m http.server 8000 --directory build/docs", depends-on = ["docs"] }

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.browser.pypi-dependencies]
# mirrors [project.optional-dependencies].browser-test (dependency truth
# stays in [project]; this feature only opts an environment into it)
playwright = ">=1.55"
pytest-rerunfailures = ">=14"
pytest-timeout = ">=2.3"

[tool.pixi.environments]
# per-Python test environments; `pixi run -e py310 test` etc.
py310 = ["py310"]
py311 = ["py311"]
py312 = ["py312"]
py313 = ["py313"]
# docs = default toolchain (node, dev extras for notebook execution) + sphinx
docs = ["docs"]
# browser = default toolchain + playwright: the browser-truth test tier
browser = ["browser"]

[tool.pixi.tasks]
test = "pytest -q"
test-vendor = "pytest -c pyproject.toml -q vendor/ipyelk/tests"
lint = "ruff format --check src tests examples scripts notebooks docs && ruff check src tests examples scripts notebooks docs"
format = "ruff format src tests examples scripts notebooks docs && ruff check --fix src tests examples scripts notebooks docs"
typecheck = "mypy"
coverage = "pytest -q --cov=longeron --cov-report=term-missing:skip-covered"
demo = "python examples/demo.py"
stdlib = "python scripts/vendor_stdlib.py --prebuilt-only"
notebooks = "python scripts/run_notebooks.py"
hooks = "git config core.hooksPath scripts/git-hooks"
# serve from the repo root so both notebooks/ (longeron tutorials) and
# vendor/ipyelk/examples/ (ipyelk demos, incl. 07_Simulation) are browsable;
# PYTHONHASHSEED pins kernel hashing so interactive runs are deterministic.
# depends-on sync-labextension: JupyterLab serves the COPY of the vendored
# jupyter-elk labextension that `pixi install` made inside each env, so a
# rebuilt vendor bundle would otherwise keep serving stale code silently.
lab = { cmd = "jupyter lab notebooks/", env = { PYTHONHASHSEED = "0" }, depends-on = [
    "sync-labextension",
] }
check = { depends-on = ["lint", "typecheck", "test", "test-vendor"] }

[tool.pixi.feature.browser.tasks.test-browser]
# the browser-truth tier (tests/browser/): boots JupyterLab headless and
# drives it with Playwright. Defined on the browser feature, so
# `pixi run test-browser` resolves to the browser environment. Depends on
# sync-labextension for the same reason `lab` does: JupyterLab serves the
# env's COPY of the vendored jupyter-elk bundle, and testing a stale copy
# proves nothing (browser binary: `pixi run -e browser playwright install
# chromium`, once per machine). --reruns 1 is the retry-once flake policy
# (see tests/browser/README.md). Per-test timeout (thread method dumps every
# stack) turns a runner-side hang into a diagnosable failure instead of an
# eaten job clock; -v streams per-test progress to the CI log live.
cmd = "pytest -v -m browser --reruns 1 --timeout 700 --timeout-method thread tests/browser"
env = { PYTHONHASHSEED = "0", PYTHONUNBUFFERED = "1" }
depends-on = ["sync-labextension"]

[tool.pixi.feature.browser.tasks.capture-widgets]
# regenerate the tutorial widget snapshots (docs/_static/widget-snapshots/):
# boots a headless JupyterLab on notebooks/, runs every notebook, and
# screenshots every rendered widget output (see the script's docstring).
# The PNGs + manifest are COMMITTED artifacts -- deliberately NOT in the
# `docs` task dependency chain, so docs builds stay deterministic and
# Chromium-free (including CI). Same browser env prerequisite as
# test-browser: `pixi run -e browser playwright install chromium` once.
cmd = "python scripts/capture_widget_snapshots.py"
env = { PYTHONHASHSEED = "0", PYTHONUNBUFFERED = "1" }
depends-on = ["sync-labextension"]

[tool.pixi.tasks.sync-labextension]
# rsync the repo's labextension BUILDS -- the vendored jupyter-elk
# (vendor/ipyelk/src/_d/...) and the longeron launcher tile (npm/_d/...,
# which editable installs never place: data_files only ship in wheels) --
# over the SERVED copies (.pixi/envs/*/share/jupyter/labextensions/...),
# warning first when a served copy is stale -- the classic "rebuilt the TS
# but the fix didn't take" footgun (the env copy is made once, at install
# time)
cmd = """
bash -euc 'sync() { src="$1"; rel="$2"; for root in .pixi/envs/*/share/jupyter/labextensions; do [ -d "$root" ] || continue; dst="$root/$rel"; if [ -d "$dst" ]; then diff -rq "$src" "$dst" >/dev/null 2>&1 || echo "WARNING: $dst was serving a STALE build (differs from the repo build); syncing" >&2; fi; mkdir -p "$dst"; rsync -a --delete "$src/" "$dst/"; done; }; sync "vendor/ipyelk/src/_d/share/jupyter/labextensions/@jupyrdf/jupyter-elk" "@jupyrdf/jupyter-elk"; sync "npm/_d/share/jupyter/labextensions/longeron" "longeron"'
"""

[tool.pixi.tasks.parsers]
cmd = "python scripts/generate_parsers.py"
inputs = ["grammars/*.g4", "scripts/generate_parsers.py"]
outputs = ["src/longeron/_gen/sysml/SysMLParser.py", "src/longeron/_gen/kerml/KerMLParser.py"]
